name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start demo
        run: docker compose -f compose.demo.yaml up --build -d --wait --wait-timeout 240
      - name: Check demo data and API
        run: |
          counts="$(docker compose -f compose.demo.yaml exec -T postgres \
            psql -U biblioapp_demo -d biblioapp_demo -t -A -F ',' \
            -c 'SELECT (SELECT count(*) FROM author), (SELECT count(*) FROM category), (SELECT count(*) FROM member), (SELECT count(*) FROM book), (SELECT count(*) FROM book_category), (SELECT count(*) FROM loan);')"
          test "$counts" = '100,100,100,100,100,100'
          curl -fsS 'http://127.0.0.1:8080/book?size=1' | jq -e '.totalElements == 100'
          curl -fsS 'http://127.0.0.1:8080/book?available=false&size=1' | jq -e '.totalElements == 20'
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.demo.yaml logs
      - name: Stop demo
        if: always()
        run: docker compose -f compose.demo.yaml down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, demo]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
