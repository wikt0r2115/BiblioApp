openapi: 3.1.0
info:
  title: BiblioApp API
  version: 1.0.0
  description: Local library catalog and loan API. IDs are generated by the database.
servers:
  - url: http://localhost:8080
paths:
  /author:
    get:
      summary: List authors
      responses:
        '200':
          description: Authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Author' }
    post:
      summary: Create an author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '201':
          description: Created author
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /category:
    get:
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /book:
    get:
      summary: Search active books
      parameters:
        - { name: authorId, in: query, schema: { type: integer, format: int64 } }
        - { name: title, in: query, schema: { type: string } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, default: 20 } }
        - name: sort
          in: query
          description: 'Field,direction; fields: bookId, title, publicationYear, available'
          schema: { type: string, example: 'title,asc' }
      responses:
        '200':
          description: Paged books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '201':
          description: Created book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /book/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Get an active book
      responses:
        '200':
          description: Book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update book details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookDetailsInput' }
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Archive a book without an active loan
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /book/{id}/isbn:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      summary: Change a book ISBN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isbn]
              properties:
                isbn: { type: string, example: '9780306406157' }
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /member:
    post:
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInput' }
      responses:
        '201':
          description: Created member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /member/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Get an active member
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update an active member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInput' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Archive a member without active loans
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /loans:
    post:
      summary: Borrow an available book for an active member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, memberId]
              properties:
                bookId: { type: integer, format: int64 }
                memberId: { type: integer, format: int64 }
      responses:
        '201':
          description: Created loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /loans/{loanId}:
    parameters:
      - { $ref: '#/components/parameters/LoanId' }
    get:
      summary: Get a loan, including one for archived entities
      responses:
        '200':
          description: Loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
  /loans/{loanId}/return:
    parameters:
      - { $ref: '#/components/parameters/LoanId' }
    post:
      summary: Return a book once
      responses:
        '200':
          description: Returned loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /members/{memberId}/loans/active:
    parameters:
      - { $ref: '#/components/parameters/MemberId' }
    get:
      summary: List active loans for a member, including an archived member
      responses:
        '200':
          description: Active loans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanList' }
        '404': { $ref: '#/components/responses/NotFound' }
  /members/{memberId}/loans/history:
    parameters:
      - { $ref: '#/components/parameters/MemberId' }
    get:
      summary: List returned loans for a member, including an archived member
      responses:
        '200':
          description: Returned loans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanList' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LoanId:
      name: loanId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: Invalid request body, identifier or query
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is archived
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Duplicate data or a business rule prevents the operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AuthorInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    Author:
      allOf:
        - { $ref: '#/components/schemas/AuthorInput' }
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    Category:
      allOf:
        - { $ref: '#/components/schemas/CategoryInput' }
        - type: object
          required: [categoryId]
          properties:
            categoryId: { type: integer, format: int64 }
    BookDetailsInput:
      type: object
      required: [title, publicationYear, authorId, categoryIds]
      properties:
        title: { type: string, minLength: 1 }
        publicationYear: { type: integer, minimum: 1450 }
        authorId: { type: integer, format: int64 }
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
    BookInput:
      allOf:
        - { $ref: '#/components/schemas/BookDetailsInput' }
        - type: object
          required: [isbn]
          properties:
            isbn: { type: string, example: '9780306406157' }
    Book:
      type: object
      required: [id, isbn, title, publicationYear, available, author, categories]
      properties:
        id: { type: integer, format: int64 }
        isbn: { type: string }
        title: { type: string }
        publicationYear: { type: integer }
        available: { type: boolean }
        author: { $ref: '#/components/schemas/Author' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    BookPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    MemberInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
    Member:
      allOf:
        - { $ref: '#/components/schemas/MemberInput' }
        - type: object
          required: [memberId]
          properties:
            memberId: { type: integer, format: int64 }
    Loan:
      type: object
      required: [loanId, bookId, bookTitle, memberId, memberFirstName, memberLastName, memberEmail, borrowedAt, active]
      properties:
        loanId: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        bookTitle: { type: string }
        memberId: { type: integer, format: int64 }
        memberFirstName: { type: string }
        memberLastName: { type: string }
        memberEmail: { type: string, format: email }
        borrowedAt: { type: string, format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        active: { type: boolean }
    LoanList:
      type: array
      items: { $ref: '#/components/schemas/Loan' }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
